server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas a la API se reenvian al API Gateway (por la red interna de Docker).
    # Para el navegador es el mismo origen: no hace falta CORS.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # React Router: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
