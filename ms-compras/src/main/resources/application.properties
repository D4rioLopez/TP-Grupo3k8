spring.application.name=ms-compras
server.port=8083

# --- Base de datos propia de compras ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/compras_db}
spring.datasource.username=${DB_USER:compras}
spring.datasource.password=${DB_PASSWORD:compras123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Seguridad (Resource Server) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:9090/realms/depositoclick}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:9090/realms/depositoclick/protocol/openid-connect/certs}

# --- Microservicios que consume (dentro de la zona confiable) ---
app.catalogo.base-url=${CATALOGO_URL:http://localhost:8081}
app.inventario.base-url=${INVENTARIO_URL:http://localhost:8082}

# --- APIs publicas externas de feriados ---
app.feriados.nager-url=${NAGER_URL:https://date.nager.at}
app.feriados.argentinadatos-url=${ARGENTINADATOS_URL:https://api.argentinadatos.com}
# cuantos dias se considera "fresco" un calendario descargado
app.feriados.cache-dias=7

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
app.openapi.token-url=${OPENAPI_TOKEN_URL:http://localhost:9090/realms/depositoclick/protocol/openid-connect/token}

management.endpoints.web.exposure.include=health,info

app.datos-iniciales=true
