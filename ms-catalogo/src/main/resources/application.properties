spring.application.name=ms-catalogo
server.port=8081

# --- Base de datos (cada microservicio tiene SU base dentro del mismo PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo_db}
spring.datasource.username=${DB_USER:catalogo}
spring.datasource.password=${DB_PASSWORD:catalogo123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Seguridad: Resource Server que valida JWT emitidos por Keycloak ---
# issuer-uri: el "iss" que tienen que traer los tokens (lo que ve el usuario: localhost:9090)
# jwk-set-uri: de donde bajamos las claves publicas (dentro de Docker: keycloak:9090)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:9090/realms/depositoclick}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:9090/realms/depositoclick/protocol/openid-connect/certs}

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
app.openapi.token-url=${OPENAPI_TOKEN_URL:http://localhost:9090/realms/depositoclick/protocol/openid-connect/token}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

app.datos-iniciales=true
