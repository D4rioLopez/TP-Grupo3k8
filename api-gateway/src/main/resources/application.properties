spring.application.name=api-gateway
server.port=8080

# --- Microservicios (solo los conoce el gateway; dentro de Docker se resuelven por nombre) ---
app.gateway.url-catalogo=${CATALOGO_URL:http://localhost:8081}
app.gateway.url-inventario=${INVENTARIO_URL:http://localhost:8082}
app.gateway.url-compras=${COMPRAS_URL:http://localhost:8083}

# --- Timeouts hacia los microservicios ---
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=20s

# --- Seguridad: el gateway tambien es Resource Server (valida el JWT de Keycloak) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:9090/realms/depositoclick}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:9090/realms/depositoclick/protocol/openid-connect/certs}

# --- Swagger UI unificado con la documentacion de los 3 microservicios ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Catalogo
springdoc.swagger-ui.urls[0].url=/docs/catalogo
springdoc.swagger-ui.urls[1].name=Inventario
springdoc.swagger-ui.urls[1].url=/docs/inventario
springdoc.swagger-ui.urls[2].name=Compras
springdoc.swagger-ui.urls[2].url=/docs/compras
springdoc.swagger-ui.oauth.client-id=depositoclick-client
springdoc.swagger-ui.persist-authorization=true

management.endpoints.web.exposure.include=health,info
