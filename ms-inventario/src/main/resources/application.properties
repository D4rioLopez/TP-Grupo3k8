spring.application.name=ms-inventario
server.port=8082

# --- Base de datos propia del inventario ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}
spring.datasource.username=${DB_USER:inventario}
spring.datasource.password=${DB_PASSWORD:inventario123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Seguridad (Resource Server) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:9090/realms/depositoclick}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:9090/realms/depositoclick/protocol/openid-connect/certs}

# --- Integracion con ms-catalogo ---
app.catalogo.base-url=${CATALOGO_URL:http://localhost:8081}
# cuanto tiempo se acepta la copia local de un articulo si el catalogo no responde
app.catalogo.snapshot-validez-horas=24

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
app.openapi.token-url=${OPENAPI_TOKEN_URL:http://localhost:9090/realms/depositoclick/protocol/openid-connect/token}

management.endpoints.web.exposure.include=health,info

app.datos-iniciales=true
